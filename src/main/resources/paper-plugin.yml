name: EasyScoreboard
version: '1.0.0'
main: com.easyscoreboard.EasyScoreboardPlugin
api-version: '1.21'
description: Easy configurable scoreboard — per-player toggle, DB persistent, PlaceholderAPI-ready.
prefix: EasyScoreboard
author: you
dependencies:
  required:
    PurrCore: { load: BEFORE, required: false }
  soft:
    PlaceholderAPI: { load: BEFORE, required: false }
permissions:
  easyscoreboard.use: { description: Use scoreboard, default: true }
  easyscoreboard.admin: { description: Admin, default: op }
commands:
  scoreboard:
    description: Toggle or manage scoreboard
    usage: /scoreboard [toggle|on|off|reload|board]
    permission: easyscoreboard.use
